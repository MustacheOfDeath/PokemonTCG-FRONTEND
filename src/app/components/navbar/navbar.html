@if (isUserLoggedIn()) {
  <nav class="bg-(--bg-navbar)/90 backdrop-blur-md text-(--text-navbar) shadow-lg sticky top-0 z-40 w-full transition-colors duration-300">
    <div class="max-w-7xl mx-auto px-2 sm:px-6">
      <div class="flex items-center justify-between h-16">

        <div class="flex items-center space-x-1 cursor-pointer" routerLink="/dashboard">
          <div class="w-8 h-8 bg-amber-400 rounded-full flex items-center justify-center shrink-0">
            <img src="/favicon.ico" alt="Pocket" class="w-5 h-5 object-contain">
          </div>
          <span class="font-bold text-lg tracking-wider text-transparent bg-clip-text bg-linear-to-r from-amber-400 to-yellow-200">
            PokéCollector
          </span>
        </div>

        <div class="flex items-center gap-1 sm:gap-3">
          <button (click)="themeService.toggleTheme()" class="cursor-pointer p-1 sm:p-2 hover:bg-(--bg-main) active:scale-90 rounded-full text-amber-400 transition-all">
            @if (themeService.isDarkMode()) {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
            } @else {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-6.354z" /></svg>
            }
          </button>

          <a href="https://ko-fi.com/mustacheofdeath" target="_blank" rel="noopener noreferrer"
             class="cursor-pointer hidden sm:flex items-center gap-2 bg-[#FF5E5B]/10 hover:bg-[#FF5E5B]/20 text-[#FF5E5B] border border-[#FF5E5B]/30 px-3.5 py-1.5 rounded-full text-xs font-bold transition-all active:scale-95"
             title="Support me on Ko-fi">
            <img src="https://storage.ko-fi.com/cdn/logomarkLogo.png" alt="Ko-fi Logo" class="w-4 h-4 object-contain shrink-0">
            <span>Ko-fi</span>
          </a>

          <a href="https://ko-fi.com/mustacheofdeath" target="_blank" rel="noopener noreferrer"
             class="cursor-pointer sm:hidden p-2 bg-[#FF5E5B]/10 text-[#FF5E5B] rounded-full border border-[#FF5E5B]/30 flex items-center justify-center transition-all active:scale-95"
             title="Support me on Ko-fi">
            <img src="https://storage.ko-fi.com/cdn/logomarkLogo.png" alt="Ko-fi Logo" class="w-4 h-4 object-contain shrink-0">
          </a>

          <div class="relative" (click)="$event.stopPropagation()">
            <button (click)="isMenuOpen = !isMenuOpen"
                    class="cursor-pointer flex items-center gap-2 bg-(--bg-input) px-2 sm:px-4 py-1.5 rounded-full border border-(--border-color) transition-all active:scale-[0.97] hover:bg-(--bg-main) max-w-35 sm:max-w-none">

              <img [src]="getUserAvatar()" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full border border-emerald-400 object-cover shrink-0" alt="/assets/userPlaceholder.png">

              <div class="flex flex-col items-start overflow-hidden">
                <span class="text-(--text-accent) font-bold text-[10px] sm:text-xs leading-none truncate w-full">{{ getUsername() }}</span>
              </div>

              <span class="text-[8px] sm:text-[10px] text-slate-500 transition-transform duration-300 shrink-0" [class.rotate-180]="isMenuOpen"> ▼ </span>
            </button>

            @if (isMenuOpen) {
              <div class="absolute right-0 mt-2 w-56 sm:w-64 bg-(--bg-input) border-slate-800 rounded-2xl shadow-2xl py-2 z-50 overflow-hidden animate-in fade-in slide-in-from-top-2 duration-150">

                <div class="px-4 py-3 border-b border-slate-800">
                  <p class="text-[10px] uppercase tracking-widest text-(--text-main) font-bold">Trainer Profile</p>
                  <p class="text-sm font-bold  text-(--text-accent)">{{ getUsername() }}</p>
                </div>

                @if (!isAdmin()) {
                  <div class="py-1">
                    <a (click)="selectSection('all')"
                       class="group flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-(--text-main) hover:bg-(--bg-main) hover:text-(--text-main) transition-colors duration-150 cursor-pointer">
                      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h12a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V6z" /></svg>
                      Database
                    </a>

                    <a (click)="selectSection('collection')"
                       class="group flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-(--text-main) hover:bg-(--bg-main) hover:text-(--text-main) transition-colors duration-150 cursor-pointer">
                      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                      My Collection
                    </a>

                    <a (click)="selectSection('wishlist')"
                       class="group flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-(--text-main) hover:bg-(--bg-main) hover:text-(--text-main) transition-colors duration-150 cursor-pointer">
                      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
                      Wishlist
                    </a>
                    <hr class="border-slate-800 my-1">
                    <a routerLink="/profile" (click)='isMenuOpen = false' class="group flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-(--text-main) hover:bg-(--bg-main) hover:text-(--text-main) transition-colors duration-150 cursor-pointer">
                      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                      Profile Settings
                    </a>
                    <a routerLink="/achievements" (click)='isMenuOpen = false' class="group flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-(--text-main) hover:bg-(--bg-main) hover:text-(--text-main) transition-colors duration-150 cursor-pointer">
                      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>
                      Hall of Fame
                    </a>
                    <hr class="border-slate-800 my-1">
                    <a routerLink="/about" (click)='isMenuOpen = false' class="group flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-(--text-main) hover:bg-(--bg-main) hover:text-(--text-main) transition-colors duration-150 cursor-pointer">
                      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                      About
                    </a>
                  </div>
                }

                @if (isAdmin()) {
                  <div class="py-1 border-t border-slate-800">
                    <div class="px-4 py-2">
                      <p class="text-[10px] uppercase tracking-widest text-(--text-accent) font-bold">Admin Panel</p>
                    </div>
                    <a routerLink="/admin/dashboard" (click)='isMenuOpen = false' class="group flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-(--text-main) hover:bg-(--bg-main) hover:text-(--text-main) transition-colors duration-150 cursor-pointer">
                      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /></svg>
                      Manage Users
                    </a>
                    <a routerLink="/admin/achievements" (click)='isMenuOpen = false' class="group flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-(--text-main) hover:bg-(--bg-main) hover:text-(--text-main) transition-colors duration-150 cursor-pointer">
                      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" /></svg>
                      Manage Achievements
                    </a>
                  </div>
                }

                <button (click)="onLogout()" class="cursor-pointer group w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-rose-500 hover:bg-rose-500/10 transition-colors duration-150 text-left">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                  Sign Out
                </button>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </nav>
}
