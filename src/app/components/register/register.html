<div class="min-h-screen bg-(--bg-main) flex flex-col justify-center items-center px-4 relative overflow-hidden transition-colors duration-300">

  <div class="pointer-events-none absolute -top-24 -left-24 w-80 h-80 bg-amber-400/20 rounded-full blur-3xl"></div>
  <div class="pointer-events-none absolute -bottom-24 -right-24 w-80 h-80 bg-amber-500/10 rounded-full blur-3xl"></div>

  <div class="absolute top-4 right-4">
    <button (click)="themeService.toggleTheme()"
            class="cursor-pointer p-2.5 rounded-full bg-(--bg-card) border border-(--border-color) hover:bg-(--bg-input) active:scale-90 transition-all text-amber-500 flex items-center justify-center shadow-md"
            type="button"
            [title]="themeService.isDarkMode() ? 'Light Mode' : 'Dark Mode'">
      @if (themeService.isDarkMode()) {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      } @else {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-6.354z" />
        </svg>
      }
    </button>
  </div>

  <div class="relative max-w-md w-full bg-(--bg-card) rounded-2xl shadow-xl border border-(--border-color) p-8 transition-colors duration-300">

    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-amber-400 rounded-full flex items-center justify-center shadow-lg shadow-amber-400/30 mx-auto mb-3 overflow-hidden">
        <img src="favicon.ico" alt="Pocket" class="w-7 h-7 object-contain">
      </div>
      <h2 class="text-2xl font-black text-(--text-main) uppercase tracking-wide">Register Trainer</h2>
      <p class="text-sm text-(--text-muted) font-medium">Create an account to start your collection journey</p>
    </div>

    @if (errorMessage) {
      <div class="mb-4 p-4 bg-red-500/10 border-l-4 border-red-500 rounded-r-xl text-sm font-semibold text-red-600">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-(--text-muted) uppercase tracking-wider mb-2">Choose Username</label>
        <input type="text" [(ngModel)]="userData.username" name="username" required maxlength="18" autocomplete="username"
               class="w-full bg-(--bg-main) border border-(--border-color) rounded-xl px-4 py-2.5 text-(--text-main) focus:outline-none focus:ring-2 focus:ring-amber-500 transition-colors">
      </div>

      <div>
        <label class="block text-xs font-bold text-(--text-muted) uppercase tracking-wider mb-2">Your Email Address</label>
        <input type="email" [(ngModel)]="userData.email" name="email" required maxlength="50" autocomplete="email"
               placeholder="trainer@pallettown.com"
               class="w-full bg-(--bg-main) border border-(--border-color) rounded-xl px-4 py-2.5 text-(--text-main) placeholder-(--text-muted) opacity-80 focus:outline-none focus:ring-2 focus:ring-amber-500 transition-colors">
      </div>

      <div class="relative">
        <label class="block text-xs font-bold text-(--text-muted) uppercase tracking-wider mb-2">Choose Password </label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'"
                 [(ngModel)]="userData.password" name="password" required minlength="4" maxlength="18" autocomplete="new-password"
                 class="w-full bg-(--bg-main) border border-(--border-color) rounded-xl px-4 py-2.5 pr-12 text-(--text-main) focus:outline-none focus:ring-2 focus:ring-amber-500 transition-colors">

          <button type="button"
                  (click)="showPassword = !showPassword"
                  class="cursor-pointer absolute right-3 top-1/2 -translate-y-1/2 text-(--text-muted) hover:text-amber-500 transition-colors focus:outline-none">
            @if (showPassword) {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            } @else {
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            }
          </button>
        </div>
      </div>

      <button type="submit"
              class="cursor-pointer w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-black py-3 rounded-xl shadow-md hover:shadow-lg hover:shadow-amber-500/30 active:scale-[0.98] transition-all uppercase tracking-wider text-sm mt-2">
        Register Account
      </button>
    </form>

    <div class="text-center mt-6 text-sm">
      <span class="text-(--text-muted) font-medium">Already registered? </span>
      <a routerLink="/login" class="cursor-pointer text-amber-500 font-bold hover:underline">Log in instead</a>
    </div>

  </div>
</div>
